Organizations:
  - &OrdererOrg
    Name: OrdererMSP
    ID: OrdererMSP
    MSPDir: organizations/ordererOrganizations/example.com/msp
    Policies: { Readers: {Type: Signature, Rule: "OR('OrdererMSP.member')"}, Writers: {Type: Signature, Rule: "OR('OrdererMSP.member')"}, Admins: {Type: Signature, Rule: "OR('OrdererMSP.admin')"} }
  - &Government
    Name: GovernmentMSP
    ID: GovernmentMSP
    MSPDir: organizations/peerOrganizations/government.example.com/msp
    Policies: { Readers: {Type: Signature, Rule: "OR('GovernmentMSP.admin','GovernmentMSP.peer','GovernmentMSP.client')"}, Writers: {Type: Signature, Rule: "OR('GovernmentMSP.admin','GovernmentMSP.client')"}, Admins: {Type: Signature, Rule: "OR('GovernmentMSP.admin')"}, Endorsement: {Type: Signature, Rule: "OR('GovernmentMSP.peer')"} }
    AnchorPeers: [{Host: peer0.government.example.com, Port: 7051}]
  - &Ngo
    Name: NgoMSP
    ID: NgoMSP
    MSPDir: organizations/peerOrganizations/ngo.example.com/msp
    Policies: { Readers: {Type: Signature, Rule: "OR('NgoMSP.admin','NgoMSP.peer','NgoMSP.client')"}, Writers: {Type: Signature, Rule: "OR('NgoMSP.admin','NgoMSP.client')"}, Admins: {Type: Signature, Rule: "OR('NgoMSP.admin')"}, Endorsement: {Type: Signature, Rule: "OR('NgoMSP.peer')"} }
    AnchorPeers: [{Host: peer0.ngo.example.com, Port: 9051}]
  - &Auditor
    Name: AuditorMSP
    ID: AuditorMSP
    MSPDir: organizations/peerOrganizations/auditor.example.com/msp
    Policies: { Readers: {Type: Signature, Rule: "OR('AuditorMSP.admin','AuditorMSP.peer','AuditorMSP.client')"}, Writers: {Type: Signature, Rule: "OR('AuditorMSP.admin','AuditorMSP.client')"}, Admins: {Type: Signature, Rule: "OR('AuditorMSP.admin')"}, Endorsement: {Type: Signature, Rule: "OR('AuditorMSP.peer')"} }
    AnchorPeers: [{Host: peer0.auditor.example.com, Port: 11051}]
Capabilities:
  Channel: &ChannelCapabilities { V2_0: true }
  Orderer: &OrdererCapabilities { V2_0: true }
  Application: &ApplicationCapabilities { V2_5: true }
Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers: { Type: ImplicitMeta, Rule: "ANY Readers" }
    Writers: { Type: ImplicitMeta, Rule: "ANY Writers" }
    Admins: { Type: ImplicitMeta, Rule: "MAJORITY Admins" }
    LifecycleEndorsement: { Type: ImplicitMeta, Rule: "MAJORITY Endorsement" }
    Endorsement: { Type: ImplicitMeta, Rule: "ANY Endorsement" }
  Capabilities: *ApplicationCapabilities
Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses: [orderer.example.com:7050]
  EtcdRaft:
    Consenters:
      - Host: orderer.example.com
        Port: 7050
        ClientTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
        ServerTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
  BatchTimeout: 2s
  BatchSize: { MaxMessageCount: 10, AbsoluteMaxBytes: 99 MB, PreferredMaxBytes: 512 KB }
  Organizations:
  Policies: { Readers: {Type: ImplicitMeta, Rule: "ANY Readers"}, Writers: {Type: ImplicitMeta, Rule: "ANY Writers"}, Admins: {Type: ImplicitMeta, Rule: "MAJORITY Admins"}, BlockValidation: {Type: ImplicitMeta, Rule: "ANY Writers"} }
  Capabilities: *OrdererCapabilities
Channel: &ChannelDefaults
  Policies: { Readers: {Type: ImplicitMeta, Rule: "ANY Readers"}, Writers: {Type: ImplicitMeta, Rule: "ANY Writers"}, Admins: {Type: ImplicitMeta, Rule: "MAJORITY Admins"} }
  Capabilities: *ChannelCapabilities
Profiles:
  ReliefApplicationChannel:
    <<: *ChannelDefaults
    Orderer: { <<: *OrdererDefaults, Organizations: [*OrdererOrg] }
    Application: { <<: *ApplicationDefaults, Organizations: [*Government, *Ngo, *Auditor] }
    Consortiums: {}

x-peer: &peer
  image: hyperledger/fabric-peer:2.5.16
  environment:
    CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
    CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: reliefchain_fabric
    CORE_PEER_TLS_ENABLED: "true"
    CORE_PEER_GOSSIP_USELEADERELECTION: "true"
    CORE_PEER_GOSSIP_ORGLEADER: "false"
  volumes:
    - /var/run/docker.sock:/host/var/run/docker.sock
  networks: [reliefchain]
services:
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5.16
    container_name: orderer.example.com
    environment:
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp:ro
      - ./organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls:ro
      - orderer_data:/var/hyperledger/production/orderer
    ports: ["7050:7050", "7053:7053"]
    networks: [reliefchain]
  peer0.government.example.com:
    <<: *peer
    container_name: peer0.government.example.com
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: reliefchain_fabric
      CORE_PEER_ID: peer0.government.example.com
      CORE_PEER_ADDRESS: peer0.government.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.government.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.government.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.government.example.com:7051
      CORE_PEER_LOCALMSPID: GovernmentMSP
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/government.example.com/peers/peer0.government.example.com/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/government.example.com/peers/peer0.government.example.com/tls:/etc/hyperledger/fabric/tls:ro
      - gov_peer_data:/var/hyperledger/production
    ports: ["7051:7051"]
  peer0.ngo.example.com:
    <<: *peer
    container_name: peer0.ngo.example.com
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: reliefchain_fabric
      CORE_PEER_ID: peer0.ngo.example.com
      CORE_PEER_ADDRESS: peer0.ngo.example.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.ngo.example.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.ngo.example.com:9051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.government.example.com:7051
      CORE_PEER_LOCALMSPID: NgoMSP
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/ngo.example.com/peers/peer0.ngo.example.com/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/ngo.example.com/peers/peer0.ngo.example.com/tls:/etc/hyperledger/fabric/tls:ro
      - ngo_peer_data:/var/hyperledger/production
    ports: ["9051:9051"]
  peer0.auditor.example.com:
    <<: *peer
    container_name: peer0.auditor.example.com
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: reliefchain_fabric
      CORE_PEER_ID: peer0.auditor.example.com
      CORE_PEER_ADDRESS: peer0.auditor.example.com:11051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:11051
      CORE_PEER_CHAINCODEADDRESS: peer0.auditor.example.com:11052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:11052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.auditor.example.com:11051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.government.example.com:7051
      CORE_PEER_LOCALMSPID: AuditorMSP
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/auditor.example.com/peers/peer0.auditor.example.com/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/auditor.example.com/peers/peer0.auditor.example.com/tls:/etc/hyperledger/fabric/tls:ro
      - auditor_peer_data:/var/hyperledger/production
    ports: ["11051:11051"]
  ca.government.example.com:
    image: hyperledger/fabric-ca:1.5.15
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    environment: { FABRIC_CA_SERVER_CA_NAME: ca-government, FABRIC_CA_SERVER_TLS_ENABLED: "true", FABRIC_CA_SERVER_PORT: 7054 }
    ports: ["7054:7054"]
    networks: [reliefchain]
  ca.ngo.example.com:
    image: hyperledger/fabric-ca:1.5.15
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    environment: { FABRIC_CA_SERVER_CA_NAME: ca-ngo, FABRIC_CA_SERVER_TLS_ENABLED: "true", FABRIC_CA_SERVER_PORT: 8054 }
    ports: ["8054:8054"]
    networks: [reliefchain]
  ca.auditor.example.com:
    image: hyperledger/fabric-ca:1.5.15
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    environment: { FABRIC_CA_SERVER_CA_NAME: ca-auditor, FABRIC_CA_SERVER_TLS_ENABLED: "true", FABRIC_CA_SERVER_PORT: 9054 }
    ports: ["9054:9054"]
    networks: [reliefchain]
volumes:
  orderer_data:
  gov_peer_data:
  ngo_peer_data:
  auditor_peer_data:
networks:
  reliefchain:
    name: reliefchain_fabric
    external: true

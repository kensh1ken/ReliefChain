services:
  - type: web
    name: reliefchain-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: reliefchain-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: BENEFICIARY_HMAC_SECRET
        generateValue: true
      - key: MOCK_OTP
        sync: false
      - key: DEMO_BENEFICIARY_PHONE
        value: "+919876543210"
      - key: WEB_ORIGIN
        sync: false
      - key: AUTO_SEED
        value: "true"
      - key: WORKER_ENABLED
        value: "true"
      - key: LEDGER_MODE
        value: memory

  - type: web
    name: reliefchain-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: reliefchain-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: reliefchain
    user: reliefchain
    ipAllowList: []
